server {
    listen 80;
    server_name fluid.swe.bd;

    # Serve deployment scripts as static files
    location /deploy.sh {
        alias /opt/fluid/deploy.sh;
        default_type text/plain;
    }

    location /vps-agent.sh {
        alias /opt/fluid/vps-agent.sh;
        default_type text/plain;
    }

    location /nginx.conf {
        alias /opt/fluid/nginx.conf;
        default_type text/plain;
    }

    location /fluid.service {
        alias /opt/fluid/fluid.service;
        default_type text/plain;
    }

    # API routes - proxy to backend
    location /api/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Socket.io - proxy to backend
    location /socket.io/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Serve React app (static files served by backend)
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
